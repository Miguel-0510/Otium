name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar-probar-auditar:
    name: Compilar, probar y auditar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Otium.slnx

      - name: Compilar
        run: dotnet build Otium.slnx -c Release --no-restore

      - name: Probar y recoger cobertura
        run: >
          dotnet test Otium.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory TestResults

      - name: Auditar paquetes vulnerables
        run: dotnet list Otium.csproj package --vulnerable --include-transitive

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
