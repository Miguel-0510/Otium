name: Docker Build and Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: otium:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'otium:latest'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'

      - name: Publicar informe de Trivy
        if: always()
        run: |
          {
            echo "### Resultado de Trivy"
            if [ -s trivy-results.txt ]; then
              echo '```'
              cat trivy-results.txt
              echo '```'
            elif [ -f trivy-results.txt ]; then
              echo "Sin vulnerabilidades CRITICAL/HIGH sin corregir."
            else
              echo "No se generó el informe. Revisa el paso de Trivy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir informe de Trivy
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-results
          path: trivy-results.txt
          if-no-files-found: ignore
