name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar aplicación
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Otium.slnx

      - name: Compilar (Release)
        run: dotnet build Otium.slnx -c Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test Otium.slnx -c Release --no-build

      - name: Auditar paquetes vulnerables
        run: dotnet list Otium.csproj package --vulnerable --include-transitive

      - name: Publicar aplicación
        run: dotnet publish Otium.csproj -c Release -o ./publish --no-restore

      - name: Subir artefacto de publicación
        uses: actions/upload-artifact@v4
        with:
          name: otium-publicacion
          path: ./publish/**
          retention-days: 7

      - name: Crear Release (si es tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
